name: Telegram MTProto Proxy

# این ورک‌فلو توسط ربات پروکسی‌ساز اجرا می‌شود:
# سرور mtg (MTProto + FakeTLS) را بالا می‌آورد و با تونل عمومی bore در دسترس قرار می‌دهد.
# رمز پروکسی از repo secret با نام MTG_SECRET خوانده می‌شود و در لاگ‌ها مخفی (masked) می‌ماند.

on:
  workflow_dispatch:
    inputs:
      ir_tunnel:
        description: "IR tunnel host (bore server on an Iranian IP) — empty = foreign only"
        required: false
        default: ""
        type: string

# هر اجرا گروه همزمانی یکتای خودش را دارد تا ساخت پروکسی جدید،
# پروکسی‌های فعال قبلی را لغو/متوقف نکند (پشتیبانی از چند پروکسی همزمان).
concurrency:
  group: tg-proxy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  run-proxy:
    name: MTProto proxy + public tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: "📥 نصب mtg (سرور پروکسی MTProto)"
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://api.github.com/repos/9seconds/mtg/releases/latest \
            | jq -r '.assets[].browser_download_url' \
            | grep -E 'linux-amd64\.tar\.gz$' | head -n1 || true)
          if [ -z "$URL" ]; then
            echo "::error::mtg linux-amd64 asset not found"
            exit 1
          fi
          echo "Downloading: $URL"
          curl -fsSL "$URL" -o mtg.tar.gz
          tar -xzf mtg.tar.gz
          if [ ! -f ./mtg ]; then
            mv "$(find . -maxdepth 2 -type f -name mtg | head -n1)" ./mtg
          fi
          chmod +x ./mtg
          ./mtg --version || true

      - name: "📥 نصب bore (تونل TCP عمومی)"
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://api.github.com/repos/ekzhang/bore/releases/latest \
            | jq -r '.assets[].browser_download_url' \
            | grep -E 'x86_64-unknown-linux' | head -n1 || true)
          if [ -n "$URL" ]; then
            echo "Downloading: $URL"
            curl -fsSL "$URL" -o bore.tar.gz
            tar -xzf bore.tar.gz
            if [ ! -f ./bore ]; then
              mv "$(find . -maxdepth 2 -type f -name bore | head -n1)" ./bore
            fi
          else
            echo "Prebuilt binary not found; building from source..."
            cargo install bore-cli --locked
            cp "$HOME/.cargo/bin/bore" ./bore
          fi
          chmod +x ./bore
          ./bore --version

      - name: "🚀 اجرای سرور MTProto"
        env:
          MTG_SECRET: ${{ secrets.MTG_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MTG_SECRET:-}" ]; then
            echo "::error::MTG_SECRET repo secret is missing"
            exit 1
          fi
          {
            echo 'secret = "'"$MTG_SECRET"'"'
            echo 'bind-to = "0.0.0.0:1984"'
          } > config.toml
          chmod 600 config.toml
          nohup ./mtg run config.toml > mtg.log 2>&1 &
          sleep 3
          if ! pgrep -f 'mtg run' >/dev/null; then
            echo "::error::mtg failed to start"
            tail -n 30 mtg.log || true
            exit 1
          fi
          echo "✅ mtg is listening on 0.0.0.0:1984 (FakeTLS mode)"

      - name: "🌐 برقراری تونل عمومی"
        id: tunnel
        env:
          # سرور تونل (پیش‌فرض bore.pub)؛ ربات در صورت تنظیم TUNNEL_HOST این secret را ثبت می‌کند
          TUNNEL_HOST: ${{ secrets.TUNNEL_HOST }}
        run: |
          set -euo pipefail
          TUNNEL_TARGET="${TUNNEL_HOST:-bore.pub}"
          echo "Tunnel target: $TUNNEL_TARGET"
          nohup ./bore local 1984 --to "$TUNNEL_TARGET" > bore.log 2>&1 &
          PORT=""
          ESC=$(printf '%s' "$TUNNEL_TARGET" | sed 's/[.]/\\./g')
          for _ in $(seq 1 45); do
            PORT=$(grep -oE "${ESC}:[0-9]+" bore.log | head -n1 | cut -d: -f2 || true)
            if [ -n "$PORT" ]; then
              break
            fi
            if ! pgrep -f 'bore local' >/dev/null; then
              echo "::error::bore exited unexpectedly"
              tail -n 30 bore.log || true
              exit 1
            fi
            sleep 2
          done
          if [ -z "$PORT" ]; then
            echo "::error::could not detect tunnel port"
            tail -n 30 bore.log || true
            exit 1
          fi
          echo "port=$PORT" >> "$GITHUB_OUTPUT"
          echo "✅ Public tunnel is ready: $TUNNEL_TARGET:$PORT" | tee -a "$GITHUB_STEP_SUMMARY"

      # لاگ زندهٔ جابِ در حال اجرا از API گیت‌هاب خالی است؛ ربات پورت را از Artifact می‌خواند.
      - name: "📤 انتشار پورت برای ربات"
        if: success()
        env:
          TUNNEL_PORT: ${{ steps.tunnel.outputs.port }}
        run: |
          set -euo pipefail
          echo "$TUNNEL_PORT" > tunnel_port.txt
          echo "port file ready: $(cat tunnel_port.txt)"

      - name: "🇮🇷 تونل ایرانی (ورودی آیپی تمیز ایرانی)"
        if: success() && inputs.ir_tunnel != ''
        env:
          IR_TUNNEL: ${{ inputs.ir_tunnel }}
        run: |
          set -euo pipefail
          IRHOST="${IR_TUNNEL%%:*}"
          echo "IR tunnel target: $IR_TUNNEL (host: $IRHOST)"
          nohup ./bore local 1984 --to "$IR_TUNNEL" > bore_ir.log 2>&1 &
          IRPORT=""
          ESC=$(printf '%s' "$IRHOST" | sed 's/[.]/\\./g')
          for _ in $(seq 1 45); do
            IRPORT=$(grep -oE "${ESC}:[0-9]+" bore_ir.log | head -n1 | cut -d: -f2 || true)
            if [ -n "$IRPORT" ]; then
              break
            fi
            if ! pgrep -f 'bore_ir' >/dev/null && ! pgrep -f 'bore local' >/dev/null; then
              echo "::warning::IR bore process exited unexpectedly"
              tail -n 20 bore_ir.log || true
              break
            fi
            sleep 2
          done
          if [ -z "$IRPORT" ]; then
            # تونل ایرانی اختیاری است؛ نباید کل ساخت را شکست دهد
            echo "::warning::IR tunnel port not detected — foreign entry stays the only entry"
            tail -n 20 bore_ir.log || true
            exit 0
          fi
          echo "$IRPORT" > tunnel_port_ir.txt
          echo "IR_HOST=$IRHOST" >> "$GITHUB_ENV"
          echo "✅ IR tunnel ready: $IRHOST:$IRPORT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "📦 آپلود Artifact پورت ایرانی"
        if: success() && hashFiles('tunnel_port_ir.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-port-ir
          path: tunnel_port_ir.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: "📦 آپلود Artifact پورت"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-port
          path: tunnel_port.txt
          retention-days: 1
          if-no-files-found: error

      - name: "⏳ نگه‌داشتن پروکسی (~۵ ساعت و ۵۰ دقیقه)"
        run: |
          END=$((SECONDS + 346 * 60))
          IR_STARTED=0
          if [ -f tunnel_port_ir.txt ]; then
            IR_STARTED=1
          fi
          while [ $SECONDS -lt $END ]; do
            sleep 30
            if ! pgrep -f 'mtg run' >/dev/null; then
              echo "::error::mtg process died"
              exit 1
            fi
            if ! pgrep -f 'bore local' >/dev/null; then
              echo "::error::bore process died"
              exit 1
            fi
            # تونل ایرانی اختیاری است — مرگش پروکسی را نمیکشد
            if [ "$IR_STARTED" = "1" ]; then
              IRCOUNT=$(pgrep -fc 'bore local' || true)
              if [ "${IRCOUNT:-0}" -lt 2 ]; then
                echo "::warning::IR bore tunnel died — foreign tunnel keeps serving"
              fi
            fi
          done
